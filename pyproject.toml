[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentfuzz"
version = "0.3.0"
description = "Chaos engineering for AI agents — inject realistic production failures (tool timeouts, malformed responses, cost spirals, prompt injection) and find out what breaks before your users do."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pavan Subhash Tirumalasetti" },
]
keywords = [
    "agents",
    "ai-agents",
    "llm",
    "chaos-engineering",
    "fault-injection",
    "reliability",
    "testing",
    "langgraph",
    "crewai",
    "autogen",
    "prompt-injection",
    "agent-evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # langchain (the umbrella package) is optional but recommended; it ships
    # `langchain.agents.create_agent`, the modern entry point that returns the
    # same CompiledStateGraph our adapter handles.
    "langchain>=1.0",
]
crewai = ["crewai>=0.70"]
autogen = ["autogen-agentchat>=0.4"]
all = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain>=1.0",
    "crewai>=0.70",
    "autogen-agentchat>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/SubhashPavan/agentfuzz"
Documentation = "https://github.com/SubhashPavan/agentfuzz#readme"
Repository = "https://github.com/SubhashPavan/agentfuzz"
Issues = "https://github.com/SubhashPavan/agentfuzz/issues"

[project.scripts]
agentfuzz = "agentfuzz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfuzz"]

[tool.hatch.build.targets.sdist]
include = ["src/agentfuzz", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
