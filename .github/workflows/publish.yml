name: Publish to PyPI

# Triggered when a GitHub Release is published. The release tag (vX.Y.Z) must
# match the project version in pyproject.toml.
#
# Uses PyPI Trusted Publishing (OIDC) — no API tokens stored in GitHub.
# Before the first publish, register the trusted publisher at:
#   https://pypi.org/manage/account/publishing/
# with:
#   PyPI Project Name: agentfuzz
#   Owner: SubhashPavan
#   Repository name: agentfuzz
#   Workflow filename: publish.yml
#   Environment name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentfuzz
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
