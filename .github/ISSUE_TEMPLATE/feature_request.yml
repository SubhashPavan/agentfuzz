name: Feature request
description: Propose a new fault, adapter, scenario suite, or other feature.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feature?
      options:
        - "New fault type"
        - "New framework adapter"
        - "New scenario suite"
        - "Report / CLI improvement"
        - "API change"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What real-world problem does this solve? Concrete examples help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the API or behavior you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, and why you ruled them out.
